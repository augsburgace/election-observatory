[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "battleground-senate-observatory"
version = "0.1.0"
description = "Local-first, source-backed Senate election research observatory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "pandas>=2.2,<4", "numpy>=2.1,<3", "scipy>=1.14,<2", "pypdf>=5,<7",
  "alembic>=1.15,<2", "reportlab>=4.3,<5", "python-multipart>=0.0.20", "pyshp>=2.3,<4", "pyproj>=3.7,<4", "shapely>=2.1,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
